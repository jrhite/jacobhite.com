name: Deploy

# The Pages project is direct-upload rather than Git-connected, so Cloudflare
# does not build on push by itself. This workflow is what restores that: build
# here, upload the result. Same outcome, one more moving part.
#
# Requires a repository secret CLOUDFLARE_API_TOKEN with:
#   Account → Cloudflare Pages → Edit
# and CLOUDFLARE_ACCOUNT_ID (not secret, but kept alongside it).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Backstop for the local hooks, which a clone without `pnpm install` (or
      # `--no-verify`) skips. Fails the deploy rather than shipping a commit
      # that exposes a personal address — see AGENTS.md.
      - name: Check commit identity
        # On a PR, HEAD is GitHub's synthetic merge commit; check the PR's own.
        run: scripts/check-git-identity.sh ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Only production pushes publish. A PR gets built (so a broken build is
      # caught before merge) but never deployed.
      - name: Deploy to Cloudflare Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name jacobhite-com --branch main
